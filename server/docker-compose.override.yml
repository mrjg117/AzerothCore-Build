# AzerothCore-OK —— 服务端覆盖配置（官方钦定唯一扩展点）
# 只做一件事：把官方镜像（Docker Hub acore/*）换成我们带 43 模组的构建产物。
# 镜像前缀由 .env 的 TCR_NS 控制（默认腾讯云 TCR 命名空间 acok）。
# 其余编排（建库 / 导库 / 起服）全部沿用官方 docker-compose.yml，一个字不改。
services:
  ac-worldserver:
    image: ${TCR_NS:-ccr.ccs.tencentyun.com/acok}/ac-wotlk-worldserver:latest
    environment:
      - REALM_ADDRESS=${REALM_ADDRESS}
  ac-authserver:
    image: ${TCR_NS:-ccr.ccs.tencentyun.com/acok}/ac-wotlk-authserver:latest
  ac-database:
    image: ${TCR_NS:-ccr.ccs.tencentyun.com/acok}/ac-wotlk-database:latest
  ac-client-data-init:
    image: ${TCR_NS:-ccr.ccs.tencentyun.com/acok}/ac-wotlk-client-data:latest
  ac-db-import:
    image: ${TCR_NS:-ccr.ccs.tencentyun.com/acok}/ac-wotlk-db-import:latest
