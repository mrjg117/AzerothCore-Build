# ============================================================
# 本地部署 —— 从腾讯云 TCR 拉取官方构建镜像运行
# ------------------------------------------------------------
# ・镜像来自 TCR（build.yml 推上去的官方构建产物）。
# ・所有 *.conf 走运行时挂载（含 playerbots.conf），不烤进镜像。
# ・客户端数据（maps/vmaps/mmaps/dbc）需另行提取后挂到 ./data，不进镜像。
# ============================================================

services:
  db:
    image: mariadb:10.11
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: acore
      MARIADB_DATABASE: acore_auth
    volumes:
      - ./db:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s

  authserver:
    image: ${TCR_IMAGE:-ccr.ccs.tencentyun.com/your-ns/azerothcore:latest}
    command: ["/azerothcore/bin/authserver"]
    volumes:
      - ./config/worldserver.conf:/azerothcore/etc/worldserver.conf:ro
      - ./config/authserver.conf:/azerothcore/etc/authserver.conf:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worldserver:
    image: ${TCR_IMAGE:-ccr.ccs.tencentyun.com/your-ns/azerothcore:latest}
    command: ["/azerothcore/bin/worldserver"]
    volumes:
      - ./config/worldserver.conf:/azerothcore/etc/worldserver.conf:ro
      - ./config/authserver.conf:/azerothcore/etc/authserver.conf:ro
      - ./config/playerbots.conf:/azerothcore/etc/playerbots.conf:ro
      - ./data:/azerothcore/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

# 使用：
#   1. 在本文件同目录建 config/，放入 worldserver.conf / authserver.conf / playerbots.conf
#      （worldserver.conf 里把 DB 指向上面 db 服务的 3306，LoginDatabaseInfo 等按官方模板填）。
#   2. 提取客户端数据到 ./data（官方 ac-client-data 流程 / 用镜像内的 mapextractor 等工具）。
#   3. 初始化数据库：导入官方 sql（auth / world / 模组 SQL），参考 AzerothCore 官方 wiki。
#   4. 设好 TCR_IMAGE 环境变量（或直接改上面 image 行），然后：
#        docker compose up -d
