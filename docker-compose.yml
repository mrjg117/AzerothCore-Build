# ============================================================
# 本地部署 —— 从腾讯云 TCR 拉取三个独立镜像运行
# ------------------------------------------------------------
# ・wotlk-server ：官方核心（build.yml 构建）
# ・wotlk-maps   ：地图数据（build-maps.yml 独立构建）
# ・wotlk-config ：默认配置（build-config.yml 独立构建）
# ・deploy.sh 已把 maps/config 镜像内容导出到本地 ./data、./config，
#   此处整体挂载；不烤进服务器镜像、不与服务器统一更新。
# ============================================================

services:
  db:
    image: mariadb:10.11
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: acore
      MARIADB_DATABASE: acore_auth
    volumes:
      - ./db:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s

  authserver:
    image: ${TCR_IMAGE_SERVER:-ccr.ccs.tencentyun.com/your-ns/wotlk-server:latest}
    command: ["/azerothcore/bin/authserver"]
    volumes:
      - ./config:/azerothcore/etc:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worldserver:
    image: ${TCR_IMAGE_SERVER:-ccr.ccs.tencentyun.com/your-ns/wotlk-server:latest}
    command: ["/azerothcore/bin/worldserver"]
    volumes:
      - ./data:/azerothcore/data:ro
      - ./config:/azerothcore/etc:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

# 使用（推荐用 deploy.sh 一键）：
#   1. 设好镜像地址：export REG=ccr.ccs.tencentyun.com NS=azerothcore
#      （或在 .env 里写 REG/NS；也可以直接改上面的 image 行）
#   2. 执行：  ./deploy.sh up          # 拉三镜像 + 导出 data/config + 启动
#             ./deploy.sh init-db     # 首次初始化数据库（需联网拉 TDB）
#   3. 运行时改配置：直接编辑 ./config/*.conf，重启 worldserver 生效，
#      无需重新构建任何镜像。
