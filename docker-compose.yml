# ============================================================
# 本地部署 —— 从腾讯云 TCR 拉取四个独立镜像运行
# ------------------------------------------------------------
# ・wotlk-server ：官方核心（build.yml 构建）
# ・wotlk-maps   ：地图数据（build-maps.yml 独立构建）
# ・wotlk-config ：默认配置（build-config.yml 独立构建）
# ・wotlk-patches：客户端补丁 AddOn（build-patches.yml 独立构建）
# ・wotlk-web    ：注册页（build-web.yml 独立构建）
# ・deploy.sh 已把 maps/config/patches 镜像内容导出到本地
#   ./data、./config、./patches，此处整体挂载；不烤进服务器镜像。
# ============================================================

services:
  db:
    image: mariadb:10.11
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: acore
      MARIADB_DATABASE: acore_auth
    volumes:
      - ./db:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s

  authserver:
    image: ${TCR_IMAGE_SERVER:-ccr.ccs.tencentyun.com/your-ns/wotlk-server:latest}
    command: ["/azerothcore/bin/authserver"]
    volumes:
      - ./config:/azerothcore/etc:ro
    ports:
      - "3724:3724"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worldserver:
    image: ${TCR_IMAGE_SERVER:-ccr.ccs.tencentyun.com/your-ns/wotlk-server:latest}
    command: ["/azerothcore/bin/worldserver"]
    volumes:
      - ./data:/azerothcore/data:ro
      - ./config:/azerothcore/etc:ro
    ports:
      - "8085:8085"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${TCR_IMAGE_WEB:-ccr.ccs.tencentyun.com/your-ns/wotlk-web:latest}
    ports:
      - "8080:8080"
    environment:
      - WEB_PORT=8080
      - SOAP_HOST=worldserver
      - SOAP_PORT=7878
      - SOAP_LOGIN=webreg
      - SOAP_PASSWORD=${SOAP_PASSWORD:-changeme}
    volumes:
      - ./patches:/usr/src/app/static/patches:ro
    depends_on:
      - worldserver
    restart: unless-stopped

# 使用（推荐用 deploy.sh 一键）：
#   1. 设好镜像地址：export REG=ccr.ccs.tencentyun.com NS=azerothcore
#      （或在 .env 里写 REG/NS/SOAP_PASSWORD/REALM_ADDRESS）
#   2. 执行：  ./deploy.sh up          # 拉四镜像 + 导出 data/config/patches + 启动
#             ./deploy.sh init-db     # 首次初始化数据库（需联网拉 TDB）
#             ./deploy.sh set-realm <你的公网IP或域名>  # 设玩家连接地址
#   3. 运行时改配置：直接编辑 ./config/*.conf，重启 worldserver 生效，
#      无需重新构建任何镜像。
#   4. 注册页： http://<本机IP>:8080  （图形验证码 + 限频防刷 + 补丁下载）
