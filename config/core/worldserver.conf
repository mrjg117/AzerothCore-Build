# ============================================================
# worldserver.conf —— 部分覆盖（未列出的键用 AC 内置默认值）
# ------------------------------------------------------------
# 部署时由 wotlk-config 镜像导出到 ./runtime/config，整体挂载到
# /azerothcore/etc，覆盖镜像内默认 worldserver.conf。
# DB 连接指向 docker-compose 的 db 服务（主机名 db）。
# ============================================================

# 数据目录（地图文件由 wotlk-maps 镜像挂载到 ./data）
DataDir = "./data"

# 数据库连接（db 服务；root/acore 具建库权限，首次自动建 world/characters 库）
LoginDatabaseInfo      = "db;3306;root;acore;acore_auth"
WorldDatabaseInfo      = "db;3306;root;acore;acore_world"
CharacterDatabaseInfo  = "db;3306;root;acore;acore_characters"

# 玩家机器人框架
PlayerbotAI.Enabled = 1

# E5-2676v3 弱单核护栏：限制地图更新线程数，勿拉满
MapUpdate.Threads = 6

# 注册页经 SOAP 创建账号（仅内部网络，端口不映射到宿主机）
# SOAP.Login/Password 需与部署侧创建的管理账号一致（gmlevel=1，仅 account create）
SOAP.Enabled = 1
SOAP.Port = 7878
SOAP.Login = "webreg"
SOAP.Password = "CHANGE_ME_webreg_soap"
SOAP.IP = "0.0.0.0"
