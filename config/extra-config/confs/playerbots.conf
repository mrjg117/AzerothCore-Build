#############################################
# playerbots 自定义覆盖（按模组分配置）
# 仅列出与模块默认不同的项；未列出的键自动沿用模块 conf.dist 默认值。
# 通过 ac-extra-config 注入到 env/dist/etc/playerbots.conf，
# 由官方 entrypoint 的 cp -n 合并进 worldserver 的 etc/。
#############################################

# 私有服机器人规模（模块默认 500，这里收紧到更克制的量级，按需调整）
AiPlayerbot.MinRandomBots = 50
AiPlayerbot.MaxRandomBots = 200

# 真玩家全部下线后，随机机器人也退出（省资源）
AiPlayerbot.DisabledWithoutRealPlayer = 1
