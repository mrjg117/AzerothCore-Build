#############################################
# worldserver 自定义覆盖（注入 env/dist/etc/worldserver.conf）
# 仅覆盖我们需要的项；其余沿用官方 worldserver.conf 默认值。
#############################################

# ---- 注册页建号通道：启用 SOAP ----
# 外部注册服务（Cloudflare Worker）通过 SOAP 调 worldserver 执行 `account create`，SRP6 由核心自算。
# SOAP 端口 7878 仅在 compose 内部网络可达（override 不向宿主机暴露），不暴露公网。
SOAP.Enabled = 1
SOAP.Port = 7878
SOAP.IP = 0.0.0.0
SOAP.Login = __SOAP_LOGIN__
# 占位符：注入时由同名环境变量替换（见 docker-entrypoint.sh 的通用 __NAME__ 替换）
#   __SOAP_PASSWORD__ ← $SOAP_PASSWORD
#   __SOAP_LOGIN__    ← $SOAP_LOGIN
# 仅 Login / Password 为变量（worldserver 与 CF Worker 共享凭据，须按部署现场设、两边一致）；
# Port 固定 7878（内部管道，无需变量）。值来自部署机持久化 .env，重拉配置时一致、不冲关键配置、不进镜像。
SOAP.Password = __SOAP_PASSWORD__
