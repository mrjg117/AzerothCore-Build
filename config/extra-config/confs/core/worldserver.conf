#############################################
# worldserver 自定义覆盖（注入 env/dist/etc/worldserver.conf）
# 仅覆盖我们需要的项；其余沿用官方 worldserver.conf 默认值。
#############################################

# ---- 注册页建号通道：启用 SOAP ----
# 外部注册服务（Cloudflare Worker）通过 SOAP 调 worldserver 执行 `account create`，SRP6 由核心自算。
# SOAP 端口 7878 仅在 compose 内部网络可达（override 不向宿主机暴露），不暴露公网。
SOAP.Enabled = 1
SOAP.Port = 7878
SOAP.IP = 0.0.0.0
SOAP.Login = webreg
# 占位符：注入时由环境变量 SOAP_PASSWORD 替换（见 docker-entrypoint.sh）
SOAP.Password = __SOAP_PASSWORD__
