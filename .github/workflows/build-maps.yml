name: build-maps

on:
  workflow_dispatch:
  # 定期打包：取消注释启用，三选一（默认只手动）
  # schedule:
  #   - cron: '0 5 * * *'     # 每日 05:00 UTC
  #   - cron: '0 5 * * 1'     # 每周一 05:00 UTC
  #   - cron: '0 5 1 * *'     # 每月 1 号 05:00 UTC

env:
  CLIENT_DATA_REF: v20.0   # wowgaming/client-data Release tag（pinned，换源改这里）

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login TCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Login DockerHub
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download wowgaming/client-data@${{ env.CLIENT_DATA_REF }} Data.zip
        run: |
          VER="${{ env.CLIENT_DATA_REF }}"
          echo "Downloading https://github.com/wowgaming/client-data/releases/download/$VER/Data.zip"
          curl -L -o /tmp/data.zip "https://github.com/wowgaming/client-data/releases/download/$VER/Data.zip"
          mkdir -p config/maps/data
          rm -rf /tmp/extracted && mkdir -p /tmp/extracted
          unzip -q /tmp/data.zip -d /tmp/extracted
          # Data.zip 内部可能是 Data/ 顶层目录或直接 Maps/ 等；统一剥到 config/maps/data/ 顶层
          if [ -d /tmp/extracted/Data ]; then
            mv /tmp/extracted/Data/* config/maps/data/
          else
            mv /tmp/extracted/* config/maps/data/
          fi
          echo "--- data layout ---"
          ls -1 config/maps/data

      - name: Compute VERSION
        id: ver
        run: echo "version=$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build & push ac-maps (TCR + DockerHub)
        run: |
          TAGS="ccr.ccs.tencentyun.com/${{ secrets.TCR_NS }}/ac-maps:${{ steps.ver.outputs.version }},ccr.ccs.tencentyun.com/${{ secrets.TCR_NS }}/ac-maps:latest"
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            TAGS="$TAGS,docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ac-maps:${{ steps.ver.outputs.version }},docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ac-maps:latest"
          fi
          docker buildx build --tag "$TAGS" --push config/maps

      - name: Cleanup extracted data (不落盘)
        if: always()
        run: rm -rf config/maps/data /tmp/data.zip /tmp/extracted
