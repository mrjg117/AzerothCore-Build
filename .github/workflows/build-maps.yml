# ============================================================
# GitHub Actions —— 构建地图数据镜像并推腾讯云 TCR
# ------------------------------------------------------------
# ・与 wotlk-server 完全独立：只在手动触发、或 client-data /
#   Dockerfile.maps 变动时构建，不随服务器代码更新而重建。
# ・构建输入：客户端 Data 目录，来自 Secret CLIENT_DATA_URL
#   （你自己的存储，tar.gz 格式，内含 Data/ 目录）。
# ============================================================

name: Build & Push Maps (Tencent TCR)

on:
  workflow_dispatch:
  push:
    paths:
      - 'client-data/**'
      - 'build/Dockerfile.maps'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Download client data
        if: ${{ secrets.CLIENT_DATA_URL != '' }}
        run: |
          mkdir -p client-data
          curl -fsSL "${{ secrets.CLIENT_DATA_URL }}" -o client-data.tar.gz
          tar -xzf client-data.tar.gz -C client-data
          rm -f client-data.tar.gz
          echo "client-data 内容："; ls -la client-data

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/Dockerfile.maps
          push: true
          tags: |
            ${{ secrets.TCR_REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/wotlk-maps:latest
            ${{ secrets.TCR_REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/wotlk-maps:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# 所需 Secrets（除 TCR_* 外）：
#   CLIENT_DATA_URL  你的 WoW 客户端 Data 目录打包地址（tar.gz，内含 Data/）
#   如未配置，本流程会因缺少 client-data 而失败（符合预期）。
