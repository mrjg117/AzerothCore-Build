name: build-maps

on:
  workflow_dispatch:
  # 定期打包：取消注释启用，三选一（默认只手动）
  # schedule:
  #   - cron: '0 5 * * *'     # 每日 05:00 UTC
  #   - cron: '0 5 * * 1'     # 每周一 05:00 UTC
  #   - cron: '0 5 1 * *'     # 每月 1 号 05:00 UTC

env:
  CLIENT_DATA_REF: v20.0   # wowgaming/client-data Release tag（pinned，换源改这里）

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download wowgaming/client-data@${{ env.CLIENT_DATA_REF }} Data.zip
        run: |
          VER="${{ env.CLIENT_DATA_REF }}"
          echo "Downloading https://github.com/wowgaming/client-data/releases/download/$VER/Data.zip"
          curl -L -o /tmp/data.zip "https://github.com/wowgaming/client-data/releases/download/$VER/Data.zip"
          mkdir -p config/maps/data
          rm -rf /tmp/extracted && mkdir -p /tmp/extracted
          unzip -q /tmp/data.zip -d /tmp/extracted
          # Data.zip 内部可能是 Data/ 顶层目录或直接 Maps/ 等；统一剥到 config/maps/data/ 顶层
          if [ -d /tmp/extracted/Data ]; then
            mv /tmp/extracted/Data/* config/maps/data/
          else
            mv /tmp/extracted/* config/maps/data/
          fi
          echo "--- data layout ---"
          ls -1 config/maps/data

      - name: Compute VERSION
        id: ver
        run: echo "version=$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build & push ac-maps (ghcr.io)
        run: |
          TAGS="ghcr.io/${{ github.repository_owner }}/ac-maps:${{ steps.ver.outputs.version }},ghcr.io/${{ github.repository_owner }}/ac-maps:latest"
          BUILDX_TAGS=""
          IFS=',' read -ra _arr <<< "$TAGS"
          for _t in "${_arr[@]}"; do BUILDX_TAGS="$BUILDX_TAGS --tag $_t"; done
          docker buildx build $BUILDX_TAGS --push config/maps

      - name: Cleanup extracted data (不落盘)
        if: always()
        run: rm -rf config/maps/data /tmp/data.zip /tmp/extracted

      - name: Set package visibility public (供服务器匿名 pull)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${{ github.repository_owner }}%2Fac-maps/visibility" \
            -d '{"visibility":"public"}'
