# ============================================================
# GitHub Actions —— 构建补丁数据镜像并推腾讯云 TCR
# ------------------------------------------------------------
# ・与 wotlk-server 完全独立：手动触发，或本文件变动时构建。
# ・镜像内容 = client-patches/ 内的静态补丁（MPQ + AddOn，按模组分子目录），纯 COPY 构建。
# ============================================================

name: Build & Push Patches (Tencent TCR)

on:
  workflow_dispatch:
  push:
    paths:
      - 'build/Dockerfile.patches'
      - 'client-patches/**'
      - '.github/workflows/build-patches.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/Dockerfile.patches
          push: true
          tags: |
            ${{ secrets.TCR_REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/wotlk-patches:latest
            ${{ secrets.TCR_REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/wotlk-patches:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
