name: build-core

on:
  workflow_dispatch:
  # 定期打包：取消注释启用，三选一（默认只手动）
  # schedule:
  #   - cron: '0 4 * * *'     # 每日 04:00 UTC
  #   - cron: '0 4 * * 1'     # 每周一 04:00 UTC
  #   - cron: '0 4 1 * *'     # 每月 1 号 04:00 UTC

permissions:
  contents: read
  actions: write
  packages: write

env:
  ACORE_REF: Playerbot

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: acore-build-repo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache buildx cache (含 ccache 编译缓存，按核心分支隔离)
        uses: actions/cache@v4
        with:
          path: /tmp/acache
          # 关键：key 含 ACORE_REF，使 stock(master) 与 Playerbot 分支的 ccache 缓存互相隔离，
          # 避免切换核心后误用对方符号集的缓存导致命中混乱。mode=max 已把官方 Dockerfile 的
          # /ccache 挂载一并导出，故 ccache 跨 run 持久化——改单个模组重跑时其余 .o 直接命中。
          key: acore-buildx-${{ env.ACORE_REF }}-${{ hashFiles('config/modules.txt') }}
          restore-keys: |
            acore-buildx-${{ env.ACORE_REF }}-

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone Playerbot fork (mod-playerbots/azerothcore-wotlk) @ ${{ env.ACORE_REF }}
        run: |
          git clone --depth 1 https://github.com/mod-playerbots/azerothcore-wotlk.git official
          cd official
          git fetch --depth 1 origin "$ACORE_REF"
          git checkout "$ACORE_REF"

      - name: Clone 43 modules (strip -master suffix)
        run: |
          cd official
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            case "$url" in \#*) continue;; esac
            name=$(basename "$url" .git); name=${name%-master}
            echo "-> $url => modules/$name"
            git clone --depth 1 "$url" "modules/$name"
          done < ../acore-build-repo/config/modules.txt

      - name: Apply build-patch (core + module source fixes before compile)
        run: |
          set -e
          # 绝对路径：仓库 checkout 到 acore-build-repo/ 子目录，避免 cd 后相对路径错位
          P="${{ github.workspace }}/acore-build-repo/build-patch"
          echo "== core patch (autonomous-altbots 核心预编译语句) =="
          ( cd official && git apply --3way --whitespace=nowarn "$P/aa_core.patch" || patch -p1 --fuzz=5 < "$P/aa_core.patch" )
          echo "== playerbots patch (纳管小号始终满 AI + 跳过随机工会) =="
          ( cd official/modules/mod-playerbots && git apply --3way --whitespace=nowarn "$P/aa_playerbots.patch" || patch -p1 --fuzz=5 < "$P/aa_playerbots.patch" )
          echo "== warrior include patch (AuraEffect 头文件) =="
          ( cd official/modules/mod-classic-warrior-additions && git apply --3way --whitespace=nowarn "$P/warrior_include.patch" || patch -p1 --fuzz=5 < "$P/warrior_include.patch" )
          echo "build-patch applied"

      - name: Build & push 4 official server targets (ghcr.io)
        run: |
          cd official
          VERSION="$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)"
          CACHE="--cache-from=type=local,src=/tmp/acache --cache-to=type=local,mode=max,dest=/tmp/acache"
          # 注：client-data target 由 build-maps.yml 的 ac-maps 镜像取代
          for t in worldserver authserver db-import tools; do
            TAGS="ghcr.io/${{ github.repository_owner }}/ac-wotlk-$t:$VERSION,ghcr.io/${{ github.repository_owner }}/ac-wotlk-$t:latest"
            BUILDX_TAGS=""
            IFS=',' read -ra _arr <<< "$TAGS"
            for _t in "${_arr[@]}"; do BUILDX_TAGS="$BUILDX_TAGS --tag $_t"; done
            docker buildx build $CACHE --target "$t" -f apps/docker/Dockerfile --build-arg CMODULES=static $BUILDX_TAGS --push .
          done

      - name: Set package visibility public (供服务器匿名 pull)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for t in worldserver authserver db-import tools; do
            curl -sS -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/container/${{ github.repository_owner }}%2Fac-wotlk-$t/visibility" \
              -d '{"visibility":"public"}'
          done

      - name: Prune old versions (keep latest 12)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: "12"
        run: |
          set +e
          owner="${{ github.repository_owner }}"
          # 包名形如 owner/repo，斜杠需编码为 %2F（纯 bash，不依赖 python3）
          enc() { local s="$1"; s="${s/\//%2F}"; printf '%s' "$s"; }
          otype=$(gh api "users/$owner" --jq '.type' 2>/dev/null)
          if [ "$otype" = "Organization" ]; then base="orgs/$owner/packages/container"; else base="user/packages/container"; fi
          prune() {
            local pkg="$1" e ids ids_arr=() n i vid
            e=$(enc "$pkg")
            echo "pruning $pkg (enc=$e)"
            ids=$(gh api "$base/$e/versions?per_page=100" --jq 'sort_by(.created_at)|reverse|.[].id' 2>/dev/null)
            if [ -z "$ids" ]; then echo "  no versions, skip"; return 0; fi
            while IFS= read -r line; do [ -n "$line" ] && ids_arr+=("$line"); done <<< "$ids"
            n=${#ids_arr[@]}
            if [ "$n" -le "${KEEP}" ]; then echo "  $n <= ${KEEP}, keep all"; return 0; fi
            echo "  $n versions, deleting $((n-KEEP)) oldest"
            for ((i=KEEP; i<n; i++)); do
              vid="${ids_arr[i]}"
              if gh api -X DELETE "$base/$e/versions/$vid" >/dev/null 2>&1; then echo "  deleted $vid"; else echo "  FAILED $vid"; fi
            done
          }
          for t in worldserver authserver db-import tools; do prune "$owner/ac-wotlk-$t"; done
