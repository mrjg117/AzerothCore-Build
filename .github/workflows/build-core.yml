name: build-core

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

env:
  ACORE_REF: master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: acore-build-repo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login TCR
        uses: docker/login-action@v3
        with:
          registry: tcr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Login DockerHub
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Clone official azerothcore-wotlk @ ${{ env.ACORE_REF }}
        run: |
          git clone --depth 1 https://github.com/azerothcore/azerothcore-wotlk.git official
          cd official
          git fetch --depth 1 origin "$ACORE_REF"
          git checkout "$ACORE_REF"

      - name: Clone 43 modules (strip -master suffix)
        run: |
          cd official
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            case "$url" in \#*) continue;; esac
            name=$(basename "$url" .git); name=${name%-master}
            echo "-> $url => modules/$name"
            git clone --depth 1 "$url" "modules/$name"
          done < ../acore-build-repo/modules.txt

      - name: Compute VERSION
        id: ver
        run: echo "version=$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build & push 5 official targets (TCR + DockerHub)
        run: |
          cd official
          CACHE="--cache-from=type=local,src=/tmp/acache --cache-to=type=local,mode=max,dest=/tmp/acache"
          for t in worldserver authserver db-import client-data tools; do
            TAGS="tcr.ccs.tencentyun.com/${{ secrets.TCR_NS }}/ac-wotlk-$t:${{ steps.ver.outputs.version }},tcr.ccs.tencentyun.com/${{ secrets.TCR_NS }}/ac-wotlk-$t:latest"
            if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              TAGS="$TAGS,docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ac-wotlk-$t:${{ steps.ver.outputs.version }},docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ac-wotlk-$t:latest"
            fi
            docker buildx build $CACHE --target "$t" -f apps/docker/Dockerfile --build-arg CMODULES=static --tag "$TAGS" --push .
          done

      - name: Assemble deploy bundle
        run: |
          cd official
          bash ../acore-build-repo/scripts/assemble-deploy-bundle.sh "${{ steps.ver.outputs.version }}" "$PWD/../acore-build-repo"

      - name: Upload bundle to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deploy-${{ steps.ver.outputs.version }}
          name: Deploy Bundle ${{ steps.ver.outputs.version }}
          files: acore-build-repo/ac-deploy-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
