name: build-core

on:
  workflow_dispatch:
  # 定期打包：取消注释启用，三选一（默认只手动）
  # schedule:
  #   - cron: '0 4 * * *'     # 每日 04:00 UTC
  #   - cron: '0 4 * * 1'     # 每周一 04:00 UTC
  #   - cron: '0 4 1 * *'     # 每月 1 号 04:00 UTC

permissions:
  contents: read
  actions: write

env:
  ACORE_REF: master
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: acore-build-repo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache buildx cache (含 ccache 编译缓存)
        uses: actions/cache@v4
        with:
          path: /tmp/acache
          key: acore-buildx-${{ hashFiles('config/modules.txt') }}
          restore-keys: |
            acore-buildx-

      - name: Login CCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Login DockerHub (optional, 仅当填了 DOCKERHUB_TOKEN 机密)
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Clone official azerothcore-wotlk @ ${{ env.ACORE_REF }}
        run: |
          git clone --depth 1 https://github.com/azerothcore/azerothcore-wotlk.git official
          cd official
          git fetch --depth 1 origin "$ACORE_REF"
          git checkout "$ACORE_REF"

      - name: Clone 43 modules (strip -master suffix)
        run: |
          cd official
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            case "$url" in \#*) continue;; esac
            name=$(basename "$url" .git); name=${name%-master}
            echo "-> $url => modules/$name"
            git clone --depth 1 "$url" "modules/$name"
          done < ../acore-build-repo/config/modules.txt

      - name: Build & push 4 official server targets (CCR)
        run: |
          cd official
          VERSION="$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)"
          CACHE="--cache-from=type=local,src=/tmp/acache --cache-to=type=local,mode=max,dest=/tmp/acache"
          # 注：client-data target 由 build-maps.yml 的 ac-maps 镜像取代
          for t in worldserver authserver db-import tools; do
            TAGS="ccr.ccs.tencentyun.com/${{ secrets.TCR_NS }}/ac-wotlk-$t:$VERSION,ccr.ccs.tencentyun.com/${{ secrets.TCR_NS }}/ac-wotlk-$t:latest"
            if [ -n "$DOCKERHUB_TOKEN" ]; then
              TAGS="$TAGS,docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ac-wotlk-$t:$VERSION,docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ac-wotlk-$t:latest"
            fi
            BUILDX_TAGS=""
            IFS=',' read -ra _arr <<< "$TAGS"
            for _t in "${_arr[@]}"; do BUILDX_TAGS="$BUILDX_TAGS --tag $_t"; done
            docker buildx build $CACHE --target "$t" -f apps/docker/Dockerfile --build-arg CMODULES=static $BUILDX_TAGS --push .
          done
