# ============================================================
# GitHub Actions —— 构建注册页镜像并推腾讯云 TCR
# ------------------------------------------------------------
# ・与 wotlk-server 完全独立：手动触发，或 wotlk-web/ 变动时构建。
# ・镜像 = Node/Express 注册页（图形验证码 + 限频 + SOAP 写库 + 下载）。
# ============================================================

name: Build & Push Web (Tencent TCR)

on:
  workflow_dispatch:
  push:
    paths:
      - 'web/wotlk-web/**'
      - 'web/wotlk-web/Dockerfile'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web/wotlk-web
          file: ./web/wotlk-web/Dockerfile
          push: true
          tags: |
            ${{ secrets.TCR_REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/wotlk-web:latest
            ${{ secrets.TCR_REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/wotlk-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
