name: build-mysql

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull & push mysql:8.4 to ghcr (部署直连免走 Docker Hub)
        run: |
          docker pull mysql:8.4
          docker tag mysql:8.4 "ghcr.io/${{ github.repository_owner }}/ac-wotlk-mysql:8.4"
          docker tag mysql:8.4 "ghcr.io/${{ github.repository_owner }}/ac-wotlk-mysql:latest"
          docker push "ghcr.io/${{ github.repository_owner }}/ac-wotlk-mysql:8.4"
          docker push "ghcr.io/${{ github.repository_owner }}/ac-wotlk-mysql:latest"

      - name: Set package visibility public (供服务器匿名 pull)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${{ github.repository_owner }}%2Fac-wotlk-mysql/visibility" \
            -d '{"visibility":"public"}'
