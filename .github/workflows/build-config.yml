name: build-config

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "config/**"

permissions:
  contents: read
  packages: write

env:
  ACORE_REF: master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute VERSION
        id: ver
        run: echo "version=$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build & push ac-extra-config (ghcr.io)
        run: |
          TAGS="ghcr.io/${{ github.repository_owner }}/ac-extra-config:${{ steps.ver.outputs.version }},ghcr.io/${{ github.repository_owner }}/ac-extra-config:latest"
          BUILDX_TAGS=""
          IFS=',' read -ra _arr <<< "$TAGS"
          for _t in "${_arr[@]}"; do BUILDX_TAGS="$BUILDX_TAGS --tag $_t"; done
          docker buildx build $BUILDX_TAGS --push config/extra-config

      - name: Set package visibility public (供服务器匿名 pull)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${{ github.repository_owner }}%2Fac-extra-config/visibility" \
            -d '{"visibility":"public"}'

      - name: Prune old versions (keep latest 12)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: "12"
        run: |
          set +e
          owner="${{ github.repository_owner }}"
          # 包名形如 owner/repo，斜杠需编码为 %2F（纯 bash，不依赖 python3）
          enc() { local s="$1"; s="${s/\//%2F}"; printf '%s' "$s"; }
          otype=$(gh api "users/$owner" --jq '.type' 2>/dev/null)
          if [ "$otype" = "Organization" ]; then base="orgs/$owner/packages/container"; else base="user/packages/container"; fi
          prune() {
            local pkg="$1" e ids ids_arr=() n i vid
            e=$(enc "$pkg")
            echo "pruning $pkg (enc=$e)"
            ids=$(gh api "$base/$e/versions?per_page=100" --jq 'sort_by(.created_at)|reverse|.[].id' 2>/dev/null)
            if [ -z "$ids" ]; then echo "  no versions, skip"; return 0; fi
            while IFS= read -r line; do [ -n "$line" ] && ids_arr+=("$line"); done <<< "$ids"
            n=${#ids_arr[@]}
            if [ "$n" -le "${KEEP}" ]; then echo "  $n <= ${KEEP}, keep all"; return 0; fi
            echo "  $n versions, deleting $((n-KEEP)) oldest"
            for ((i=KEEP; i<n; i++)); do
              vid="${ids_arr[i]}"
              if gh api -X DELETE "$base/$e/versions/$vid" >/dev/null 2>&1; then echo "  deleted $vid"; else echo "  FAILED $vid"; fi
            done
          }
          prune "$owner/ac-extra-config"
