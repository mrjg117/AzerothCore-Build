# ============================================================
# GitHub Actions —— 构建配置镜像并推腾讯云 TCR
# ------------------------------------------------------------
# ・与 wotlk-server 完全独立：只在手动触发、或 config/ 下配置源 /
#   Dockerfile.config 变动时构建。
# ・镜像内容 = 仓库 config/core/ + config/modules/<模组>/*.conf
#   扁平合并后的 /azerothcore/etc/（合并逻辑见 build/Dockerfile.config）。
# ============================================================

name: Build & Push Config (Tencent TCR)

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/**'
      - 'build/Dockerfile.config'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/Dockerfile.config
          push: true
          tags: |
            ${{ secrets.TCR_REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/wotlk-config:latest
            ${{ secrets.TCR_REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/wotlk-config:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
