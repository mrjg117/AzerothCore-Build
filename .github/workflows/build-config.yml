name: build-config

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "config/**"

permissions:
  contents: read
  packages: write

env:
  ACORE_REF: master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute VERSION
        id: ver
        run: echo "version=$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build & push ac-extra-config (ghcr.io)
        run: |
          TAGS="ghcr.io/${{ github.repository_owner }}/ac-extra-config:${{ steps.ver.outputs.version }},ghcr.io/${{ github.repository_owner }}/ac-extra-config:latest"
          BUILDX_TAGS=""
          IFS=',' read -ra _arr <<< "$TAGS"
          for _t in "${_arr[@]}"; do BUILDX_TAGS="$BUILDX_TAGS --tag $_t"; done
          docker buildx build $BUILDX_TAGS --push config/extra-config

      - name: Set package visibility public (供服务器匿名 pull)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${{ github.repository_owner }}%2Fac-extra-config/visibility" \
            -d '{"visibility":"public"}'
