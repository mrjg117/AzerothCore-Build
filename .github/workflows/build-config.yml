name: build-config

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "config/**"

permissions:
  contents: read

env:
  ACORE_REF: master
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login CCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Login DockerHub (optional, 仅当填了 DOCKERHUB_TOKEN 机密)
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute VERSION
        id: ver
        run: echo "version=$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build & push ac-extra-config (CCR)
        run: |
          TAGS="ccr.ccs.tencentyun.com/${{ secrets.TCR_NS }}/ac-extra-config:${{ steps.ver.outputs.version }},ccr.ccs.tencentyun.com/${{ secrets.TCR_NS }}/ac-extra-config:latest"
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            TAGS="$TAGS,docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ac-extra-config:${{ steps.ver.outputs.version }},docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ac-extra-config:latest"
          fi
          BUILDX_TAGS=""
          IFS=',' read -ra _arr <<< "$TAGS"
          for _t in "${_arr[@]}"; do BUILDX_TAGS="$BUILDX_TAGS --tag $_t"; done
          docker buildx build $BUILDX_TAGS --push config/extra-config
