# 本文件是官方 docker-compose.yml 的唯一扩展点（官方原文第 4-5 行钦定）。
# 只做两件事：① 把官方镜像地址从 Docker Hub 换成我们的 TCR/DockerHub；② 追加 ac-web 注册页服务。
# 不修改官方任何 service 的定义逻辑：ac-web 是「新增服务」，其余官方服务的镜像只是「替换指向」，
# 其余字段（env_file / depends_on / healthcheck / ports / volumes）全部继承官方。

services:
  # 官方 4 个核心 server 服务：仅替换镜像，其余（env_file / depends_on / healthcheck / ports）继承官方
  ac-worldserver:
    image: tcr.ccs.tencentyun.com/${TCR_NS}/ac-wotlk-worldserver:${IMAGE_TAG}
    ports:
      # 只开放游戏端口；SOAP(7878) 仅容器网络内可达，不暴露公网
      - "8085:8085"

  ac-authserver:
    image: tcr.ccs.tencentyun.com/${TCR_NS}/ac-wotlk-authserver:${IMAGE_TAG}
    ports:
      - "3724:3724"

  ac-db-import:
    image: tcr.ccs.tencentyun.com/${TCR_NS}/ac-wotlk-db-import:${IMAGE_TAG}

  ac-tools:
    image: tcr.ccs.tencentyun.com/${TCR_NS}/ac-wotlk-tools:${IMAGE_TAG}

  # 客户端地图数据：替换官方 ac-client-data-init 的镜像（官方真名是 ac-client-data-init，不是 ac-client-data）。
  # 官方该服务把命名卷 ac-client-data 读写挂载到 /azerothcore/env/dist/data；
  # 我们的 ac-maps 镜像在容器内把预烤的社区地图数据 cp 进该卷后退出，随后 ac-worldserver 以 :ro 读同一卷。
  # build: null 关闭官方自带的 build（否则部署机若漏 pull 会被触发本地编译整个 azerothcore）。
  ac-client-data-init:
    image: tcr.ccs.tencentyun.com/${TCR_NS}/ac-maps:${IMAGE_TAG}
    build: null

  # 追加：最轻自研注册页（静态表单 + 单文件后端，调 worldserver SOAP account create）
  ac-web:
    image: tcr.ccs.tencentyun.com/${TCR_NS}/ac-web:${IMAGE_TAG}
    networks:
      - ac-network
    restart: unless-stopped
    ports:
      - "${AC_WEB_PORT:-8080}:8080"
    environment:
      - SOAP_HOST=ac-worldserver
      - SOAP_PORT=7878
      - SOAP_LOGIN=${SOAP_LOGIN:-webreg}
      - SOAP_PASSWORD=${SOAP_PASSWORD:-changeMeNow123!}
      - REALM_ADDRESS=${REALM_ADDRESS:-play.example.com}
    depends_on:
      ac-worldserver:
        condition: service_started
