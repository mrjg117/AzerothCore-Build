<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AzerothCore-OK · 一键部署 AzerothCore</title>
<!-- 复用天赋模拟器皮肤（暗色 + 金色描边）；仅加载 CSS，JS 懒加载 -->
<link rel="stylesheet" href="./talent-sim/assets/css/style.css">
<!-- 首屏优先：天赋模拟器 5 个 JS 在后台预取（不执行），切标签/刷新时从缓存秒加载 -->
<link rel="prefetch" as="script" href="./talent-sim/assets/js/data.js?v=20260815a">
<link rel="prefetch" as="script" href="./talent-sim/assets/js/glyphs.js?v=20260815a">
<link rel="prefetch" as="script" href="./talent-sim/assets/js/glyph_cn.js?v=20260815a">
<link rel="prefetch" as="script" href="./talent-sim/assets/js/glyph_desc.js?v=20260815a">
<link rel="prefetch" as="script" href="./talent-sim/assets/js/app.js?v=20260815a">
<style>
  /* 滚动条槽位常驻预留：避免滚动条出现/消失导致整页水平位移（点职业/加点时摇晃） */
  html{scrollbar-gutter:stable}
  /* 顶栏收紧：集成页顶栏比独立模拟器更紧凑，帮助首页一屏不滚动 */
  .topbar{padding:10px 16px}
  /* ===== 统一壳层（标签导航 / 注册面板）===== */
  /* 顶栏三区：brand 左 | tabbar 居中(flex:1) | controls 右(flex:none)
     控件用 visibility 占位（仍 display:flex）而非 display:none，避免切换时顶栏高度/标签位置抖动 */
  .topbar-inner{display:flex;align-items:center;gap:14px}
  .tabbar{flex:1;display:flex;justify-content:center;gap:6px;align-items:center}
  .controls{flex:none}
  .tab{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;
       padding:7px 16px;cursor:pointer;font-size:14px;font-weight:600}
  .tab:hover{border-color:var(--accent)}
  .tab.active{background:linear-gradient(180deg,#3a3320,#241f14);border-color:var(--gold);color:var(--gold2)}
  .controls[hidden]{display:flex;visibility:hidden;pointer-events:none}
  /* 窄屏：标签不再占满，整体居中换行 */
  @media (max-width:780px){
    .topbar-inner{flex-wrap:wrap;justify-content:center;gap:10px}
    .tabbar{flex:none}
    .controls{flex-wrap:wrap;width:100%;justify-content:center}
  }

  #panel-home{max-width:760px;margin:0 auto;padding:20px 18px 40px}
  #panel-sim{padding:18px 0 28px}
  .page-head{margin-bottom:20px}
  .page-head .sub{color:var(--gold);margin:0 0 6px;font-size:15px}
  .page-head .meta-line{color:var(--muted);font-size:13px;margin:0}
  .page-head a{color:var(--blue)}

  .card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  /* 弱化模拟器职业选择栏的「第二 header」观感：去满宽深条，使其融入页面而非独立头 */
  #panel-sim .classbar{background:transparent;border-bottom:none;padding-top:0;padding-bottom:14px}
  .card>h2{font-size:17px;margin:0 0 14px;color:var(--gold)}
  .card p.hint{color:var(--muted);font-size:13px;margin:0 0 12px}

  .file{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;
        background:var(--panel2);border:1px solid var(--line);border-radius:9px;margin-bottom:8px}
  .file .name{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:var(--text);word-break:break-all}
  .files{margin-top:10px}

  a.btn{text-decoration:none;display:inline-block}
  .btn.big{display:inline-block;padding:11px 22px;font-size:15px;margin-bottom:12px}

  code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:13px;color:var(--text)}

  .formrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .formrow label{width:60px;flex:none;font-size:13px;color:var(--muted)}
  .formrow input[type=text],.formrow input[type=password],.formrow input[type=email]{
    flex:1;min-width:160px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);
    border-radius:7px;color:var(--text);font-size:14px}
  .formrow input:focus{outline:none;border-color:var(--accent)}
  .captcha-q{font-family:ui-monospace,monospace;font-size:14px;color:var(--green);min-width:84px}
  #regMsg{font-size:13px;margin-top:6px;min-height:18px}
  #regMsg.ok{color:var(--green)} #regMsg.err{color:var(--red)}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

  /* 集成页专属：收紧天赋模拟器尺寸，使其 HD 一屏不滚动（仅影响本页，不动 style.css） */
  :root{ --step:56px; --pad-x:14px; --pad-y:12px; --icon:50px; }
  #panel-sim{padding:16px 0 24px}
  #panel-sim .classbar{padding:10px 16px 6px}
  #panel-sim .layout{padding:8px 16px;gap:14px}

  /* 顶栏控件：禁用换行 + 固定「已用/最大/剩余」框宽，避免加点时左侧「等级/最大天赋」被右侧文字顶位移 */
  .controls{flex-wrap:nowrap;white-space:nowrap;gap:14px}
  .ctl-group{display:flex;align-items:flex-end;gap:12px;flex:none}
  .ctl-group.right{align-items:center}
  .ctl{flex:none}
  .ctl label{white-space:nowrap}
  .points-box{flex:none;width:200px;justify-content:space-between;white-space:nowrap}
  .controls .btn{flex:none;white-space:nowrap}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-main">AzerothCore-OK</span>
      <span class="brand-sub">一键部署 · 3.3.5a</span>
    </div>

    <div class="tabbar">
      <button class="tab active" data-tab="home">项目及注册</button>
      <button class="tab" data-tab="sim">天赋模拟器</button>
    </div>

    <!-- 仅「天赋模拟器」标签激活时显示（.controls[hidden] 兜底） -->
    <div class="controls" id="simControls" hidden>
      <div class="ctl-group">
        <div class="ctl">
          <label for="levelSel">等级</label>
          <select id="levelSel" title="选择角色等级：自动计算可用天赋点，并解锁对应雕文槽"></select>
        </div>
        <div class="ctl">
          <label for="maxPts">最大天赋点</label>
          <input id="maxPts" type="number" min="0" max="200" step="1" value="71" title="可自定义最大天赋点（如私服特殊规则）">
        </div>
      </div>
      <div class="ctl-group right">
        <div class="points-box">
          <span class="p-used">已用 <b id="usedPts">0</b></span>
          <span class="p-sep">/</span>
          <span class="p-max">最大 <b id="maxPtsLbl">71</b></span>
          <span class="p-left">剩余 <b id="leftPts">71</b></span>
        </div>
        <button id="resetBtn" class="btn" title="清空当前职业天赋与雕文">重置</button>
        <button id="shareBtn" class="btn primary" title="生成可分享的链接（含天赋与雕文）">复制分享链接</button>
      </div>
    </div>
  </div>
</header>

<!-- 项目及注册（默认） -->
<section id="panel-home">
  <div class="page-head">
    <p class="sub">一键部署 AzerothCore</p>
    <p class="meta-line">项目地址：<a href="https://github.com/mrjg117/AzerothCore-OK" target="_blank" rel="noopener">GitHub 仓库</a> ｜ QQ群：1056344511</p>
  </div>

  <div class="card">
    <h2>账号注册</h2>
    <form id="regForm" autocomplete="off">
      <div class="formrow">
        <label>账号</label>
        <input id="regUser" type="text" maxlength="32" placeholder="请输入账号（3-32位字母/数字/下划线）" required />
      </div>
      <div class="formrow">
        <label>密码</label>
        <input id="regPass" type="password" maxlength="64" placeholder="请输入密码（至少6位）" required />
      </div>
      <div class="formrow">
        <label>确认</label>
        <input id="regPass2" type="password" maxlength="64" placeholder="再次输入密码" required />
      </div>
      <div class="formrow">
        <label>邮箱</label>
        <input id="regEmail" type="email" maxlength="64" placeholder="输入电子邮件" />
      </div>
      <div class="formrow">
        <label>验证码</label>
        <input id="capInput" type="text" maxlength="6" placeholder="计算结果" inputmode="numeric" style="max-width:120px;" required />
        <span class="captcha-q" id="capQ">?</span>
        <a class="btn" id="capRefresh" style="background:#2a2f3d;">换一题</a>
      </div>
      <input type="text" id="hp" class="hp" tabindex="-1" autocomplete="off" />
      <a class="btn primary" id="regBtn" style="border:none;margin-top:4px;">注册</a>
      <div id="regMsg"></div>
    </form>
  </div>

  <div class="card">
    <h2>客户端补丁</h2>
    <p class="hint">3.3.5a 客户端补丁，用于连接本服务器。</p>
    <a class="btn big" id="dlAll" href="#">点击下载</a>
    <div class="files" id="patchParts"></div>
  </div>

  <div class="card">
    <h2>一键部署自己的服务器</h2>
    <div class="file">
      <div class="meta">
        <div class="name" id="deployCmd">curl -fsSL .../acok.sh | bash</div>
      </div>
      <a class="btn" href="#" id="deployCopy">复制</a>
    </div>
  </div>
</section>

<!-- 天赋模拟器（默认 hidden；点击/刷新到该标签时才显示并加载 JS，渲染始终在可见面板中进行） -->
<section id="panel-sim" hidden>
  <nav id="classBar" class="classbar" aria-label="职业选择"></nav>
  <div id="statusBanner" class="status-banner"></div>
  <div class="layout" id="layout">
    <section id="glyphPanel" class="glyph-panel"></section>
  </div>
  <div id="tooltip" class="tooltip" hidden></div>
</section>

<script>
(function () {
  "use strict";

  // ===== 标签切换 + 模拟器后台构建（首屏优先，其余持续下载） + 刷新恢复 =====
  var KEY_TAB = "acok_active_tab";
  var KEY_SCROLL = "acok_scroll_y";
  var simLoaded = false;
  // 资源版本戳：与 app.js 顶部 ASSET_VER、talent-sim/index.html 保持一致；改了资源/JS 后务必同步 bump。
  var SIM_VER = "20260815a";
  window.SIM_VER = SIM_VER;
  var simBase = "./talent-sim/assets/js/";

  // 资源路径桥：data.js 内的 icon/bg/sprite 是相对 talent-sim/ 目录的路径，
  // 集成页部署在根（deploy/），需补 'talent-sim/' 前缀才能正确解析（修复图标不加载）。
  var ASSET_BRIDGE = [
    "(function(){",
    "  var base='talent-sim/';",
    "  if(typeof CLASSES!=='undefined'){",
    "    CLASSES.forEach(function(c){",
    "      if(c.icon)c.icon=base+c.icon;",
    "      (c.trees||[]).forEach(function(t){",
    "        if(t.bg)t.bg=base+t.bg;",
    "        if(t.sprite)t.sprite=base+t.sprite;",
    "      });",
    "    });",
    "  }",
    "})();"
  ].join("\n");

  function saveState() {
    try {
      var active = document.querySelector(".tab.active");
      var tab = active ? active.getAttribute("data-tab") : "home";
      localStorage.setItem(KEY_TAB, tab);
      localStorage.setItem(KEY_SCROLL + "_" + tab, String(window.scrollY));
    } catch (e) {}
  }
  // 初始标签判定：URL hash 优先（刷新时由浏览器原生保留，不依赖 localStorage），
  // localStorage 仅作兜底。这样即便预览/隐私模式下 localStorage 不可用，刷新仍能回到天赋页。
  function getInitialTab() {
    var isShare = /[?&]build=/.test(location.search) || location.hash.indexOf("#build=") === 0;
    if (isShare) return "sim";
    if (location.hash === "#sim") return "sim";
    if (location.hash === "#home") return "home";
    var ls = "home";
    try { ls = localStorage.getItem(KEY_TAB) || "home"; } catch (e) {}
    return ls === "sim" ? "sim" : "home";
  }
  // 切标签时把当前标签写进 URL hash（replaceState 不新增历史、不触发 hashchange），
  // 使刷新原生回到该标签，彻底脱离对 localStorage 的依赖。
  function syncUrlTab(tab) {
    try { history.replaceState(null, "", location.pathname + location.search + (tab === "sim" ? "#sim" : "#home")); } catch (e) {}
  }
  function savedScroll(tab) {
    var y = 0;
    try { y = parseInt(localStorage.getItem(KEY_SCROLL + "_" + tab) || "0", 10) || 0; } catch (e) {}
    return y;
  }

  var panelHome = document.getElementById("panel-home");
  var panelSim = document.getElementById("panel-sim");
  var simControls = document.getElementById("simControls");
  function showSim() {
    panelHome.hidden = true;
    panelSim.hidden = false;
    simControls.hidden = false;
  }
  function showHome() {
    panelSim.hidden = true;
    simControls.hidden = true;
    panelHome.hidden = false;
  }

  // 顺序注入：data→glyphs→glyph_cn→glyph_desc→桥→app。
  // 关键：注入前先 showSim() 让面板可见，app.js 在【可见】状态下渲染，
  // 彻底避免此前「离屏构建 → 尺寸算错/空白」的刷新 bug。点击与刷新走同一条路径，行为完全一致。
  function buildSim() {
    showSim();
    if (simLoaded) return;
    simLoaded = true;
    var order = [
      { src: "data.js" }, { src: "glyphs.js" }, { src: "glyph_cn.js" },
      { src: "glyph_desc.js" }, { code: ASSET_BRIDGE }, { src: "app.js" }
    ];
    (function next(i) {
      if (i >= order.length) return;
      var step = order[i];
      var s = document.createElement("script");
      if (step.code != null) {
        s.textContent = step.code;
        document.body.appendChild(s);
        next(i + 1);
      } else {
        s.src = simBase + step.src + "?v=" + SIM_VER;
        s.async = false;
        s.onload = function () { next(i + 1); };
        s.onerror = function () { console.error("[talent-sim] 加载失败:", step.src); next(i + 1); };
        document.body.appendChild(s);
      }
    })(0);
  }

  var tabs = document.querySelectorAll(".tab");
  tabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      tabs.forEach(function (t) { t.classList.remove("active"); });
      tab.classList.add("active");              // 先切换 active
      saveState();                              // 再存：此时 .active 已是新标签（sim/home），不依赖 beforeunload
      syncUrlTab(tab.getAttribute("data-tab")); // 写 URL hash，刷新原生保留
      if (tab.getAttribute("data-tab") === "sim") { showSim(); buildSim(); }
      else { showHome(); }
      window.scrollTo(0, 0);
    });
  });
  window.addEventListener("beforeunload", saveState);

  // 刷新/分享链接恢复：与点击路径【完全一致】（showSim + buildSim），
  // 确保刷新与首次点击行为一致——这是此前「刷新不显示」反复翻车的根因所在。
  (function restoreTab() {
    var initial = getInitialTab();
    var isShare = /[?&]build=/.test(location.search) || location.hash.indexOf("#build=") === 0;
    if (isShare || initial === "sim") {
      var simTab = document.querySelector('.tab[data-tab="sim"]');
      if (simTab) {
        tabs.forEach(function (t) { t.classList.remove("active"); });
        simTab.classList.add("active");
        showSim(); buildSim();                  // 与点击完全一致：可见后再注入渲染
        if (!isShare) window.scrollTo(0, savedScroll("sim"));
      } else { showHome(); }
    } else {
      showHome();
    }
  })();

  // ===== 客户端验证码（纯本地计算 + 蜜罐防机器）=====
  var capA, capB, capOp, capAns;
  function genCaptcha() {
    capA = 1 + Math.floor(Math.random() * 19);
    capB = 1 + Math.floor(Math.random() * 19);
    capOp = Math.random() < 0.5 ? '+' : '-';
    if (capOp === '-') {
      if (capB > capA) { var t = capA; capA = capB; capB = t; }
      capAns = capA - capB;
    } else { capAns = capA + capB; }
    document.getElementById('capQ').textContent = capA + ' ' + capOp + ' ' + capB + ' = ?';
  }
  genCaptcha();
  document.getElementById('capRefresh').addEventListener('click', function (e) {
    e.preventDefault(); genCaptcha();
    document.getElementById('capInput').value = '';
  });

  function copyText(txt, el) {
    navigator.clipboard.writeText(txt);
    var old = el.textContent; el.textContent = '已复制';
    setTimeout(function () { el.textContent = old; }, 1500);
  }

  // ===== 一键部署脚本地址（用本页所在 Worker 域名）=====
  var deployCmd = 'curl -fsSL ' + location.origin + '/acok.sh | bash';
  document.getElementById('deployCmd').textContent = deployCmd;
  document.getElementById('deployCopy').addEventListener('click', function (e) {
    e.preventDefault(); copyText(deployCmd, this);
  });

  // ===== 补丁下载：按「是否有分卷」自适应 =====
  //  - 无分卷（manifest 仅 1 个文件）：隐藏分卷下载栏，点击下载=直接下载该补丁 zip
  //  - 有分卷（>1 个文件）：显示分卷下载栏（每个分卷独立下载），
  //                          点击下载=自动合并下载全部分卷为一个 zip
  var patchParts = [];
  var dlAll = document.getElementById('dlAll');

  function downloadAll() {
    if (!patchParts.length) { alert('暂无可下载的补丁'); return; }
    Promise.all(patchParts.map(function (p) {
      return fetch('./patches/' + p).then(function (r) { return r.arrayBuffer(); });
    })).then(function (bufs) {
      var blob = new Blob(bufs, { type: 'application/zip' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'patches-client.zip';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    }).catch(function () { alert('合并下载失败，请改用分卷单独下载'); });
  }

  fetch('./patches/patches-manifest.txt').then(function (r) { return r.text(); }).then(function (t) {
    patchParts = t.split('\n').filter(function (l) { return l.indexOf('file=') === 0; })
      .map(function (l) { return l.slice(5).split(' ')[0]; });
    var box = document.getElementById('patchParts');
    if (!box) return;

    if (patchParts.length > 1) {
      // 有分卷：显示分卷下载栏（每卷独立下载）+ 点击下载=合并全部
      box.style.display = '';
      box.innerHTML = patchParts.map(function (p, i) {
        return '<div class="file"><div class="meta"><div class="name">分卷' + (i + 1) + '：' + p +
          '</div></div>' +
          '<a class="btn" href="./patches/' + p + '" download>下载</a></div>';
      }).join('');
      dlAll.removeAttribute('href');
      dlAll.onclick = function (e) { e.preventDefault(); downloadAll(); };
    } else if (patchParts.length === 1) {
      // 无分卷：隐藏分卷下载栏，点击下载=直接下载该文件
      box.style.display = 'none'; box.innerHTML = '';
      dlAll.setAttribute('href', './patches/' + patchParts[0]);
      dlAll.setAttribute('download', 'patches-client.zip');
      dlAll.onclick = null;
    } else {
      // 无可用文件
      box.style.display = 'none'; box.innerHTML = '';
      dlAll.removeAttribute('href');
      dlAll.onclick = function (e) { e.preventDefault(); alert('暂无可下载的补丁'); };
    }
  }).catch(function () {});

  // ===== 注册提交（含验证码 + 蜜罐校验）=====
  var REG_API = location.origin + '/api/register';
  document.getElementById('regBtn').addEventListener('click', function (e) {
    e.preventDefault();
    var msg = document.getElementById('regMsg');
    msg.className = ''; msg.textContent = '';
    if (document.getElementById('hp').value) { msg.className = 'err'; msg.textContent = '验证失败'; return; }
    var c = parseInt(document.getElementById('capInput').value, 10);
    if (isNaN(c) || c !== capAns) {
      msg.className = 'err'; msg.textContent = '验证码错误，已换一题';
      genCaptcha(); document.getElementById('capInput').value = ''; return;
    }
    var u = document.getElementById('regUser').value.trim();
    var p = document.getElementById('regPass').value;
    var p2 = document.getElementById('regPass2').value;
    var email = document.getElementById('regEmail').value.trim();
    if (!/^[A-Za-z0-9_]{3,32}$/.test(u)) { msg.className = 'err'; msg.textContent = '账号需 3-32 位英文/数字/下划线'; return; }
    if (p.length < 6 || /\s/.test(p)) { msg.className = 'err'; msg.textContent = '密码至少 6 位且不含空格'; return; }
    if (p !== p2) { msg.className = 'err'; msg.textContent = '两次密码不一致'; return; }
    if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg.className = 'err'; msg.textContent = '邮箱格式不正确'; return; }
    msg.textContent = '提交中…';
    fetch(REG_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p, email: email })
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, j: j }; });
    }).then(function (res) {
      if (res.ok) { msg.className = 'ok'; msg.textContent = '注册成功，可直接登录游戏'; }
      else { msg.className = 'err'; msg.textContent = (res.j && res.j.message) || '注册失败'; }
    }).catch(function () {
      msg.className = 'err'; msg.textContent = '注册服务连接失败，请稍后再试';
    });
  });
})();
</script>
</body>
