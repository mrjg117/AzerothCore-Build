<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AzerothCore-OK · 一键部署 AzerothCore</title>
  <style>
    :root { --bg:#0f1117; --card:#1a1d27; --fg:#e6e8ee; --muted:#9aa3b2; --accent:#5b8cff; --ok:#46c98b; --line:#2a2f3d; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
           background:var(--bg); color:var(--fg); line-height:1.6; }
    .wrap { max-width:760px; margin:0 auto; padding:36px 18px 70px; }
    h1 { font-size:28px; margin:0 0 4px; letter-spacing:.5px; }
    .sub { color:var(--accent); margin:0 0 6px; font-size:15px; }
    .meta-line { color:var(--muted); font-size:13px; margin:0 0 26px; }
    .meta-line a { color:var(--accent); text-decoration:none; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin-bottom:18px; }
    .card > h2 { font-size:17px; margin:0 0 14px; color:var(--accent); }
    .file { display:flex; align-items:center; justify-content:space-between; gap:12px;
            padding:12px 14px; background:#14161f; border:1px solid var(--line); border-radius:9px; margin-bottom:8px; }
    .file .meta { min-width:0; }
    .file .name { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; color:#cdd6f4; word-break:break-all; }
    a.btn { flex:none; text-decoration:none; background:var(--accent); color:#fff; font-size:13px;
            padding:7px 14px; border-radius:7px; white-space:nowrap; cursor:pointer; border:none; }
    a.btn:hover { filter:brightness(1.1); }
    a.btn.big { display:inline-block; padding:11px 22px; font-size:15px; margin-bottom:12px; }
    code { background:#14161f; border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-size:13px; color:#cdd6f4; }
    .formrow { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
    .formrow label { width:72px; flex:none; font-size:13px; color:var(--muted); }
    .formrow input { flex:1; min-width:160px; padding:8px 10px; background:#14161f; border:1px solid var(--line);
                     border-radius:7px; color:var(--fg); font-size:14px; }
    .formrow input:focus { outline:none; border-color:var(--accent); }
    .captcha-q { font-family:ui-monospace,monospace; font-size:14px; color:var(--ok); min-width:84px; }
    #regMsg { font-size:13px; margin-top:6px; min-height:18px; }
    #regMsg.ok { color:var(--ok); } #regMsg.err { color:#ff8a8a; }
    .hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
    a.link { color:var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AzerothCore-OK</h1>
    <p class="sub">一键部署 AzerothCore</p>
    <p class="meta-line">
      项目地址：<a href="https://github.com/mrjg117/AzerothCore-OK" target="_blank" rel="noopener">GitHub 仓库</a>
      ｜ QQ群：（填群号）
    </p>

    <!-- 账号注册 -->
    <div class="card">
      <h2>账号注册</h2>
      <form id="regForm" autocomplete="off">
        <div class="formrow">
          <label>账号</label>
          <input id="regUser" type="text" maxlength="32" placeholder="请输入账号（3-32位字母/数字/下划线）" required />
        </div>
        <div class="formrow">
          <label>密码</label>
          <input id="regPass" type="password" maxlength="64" placeholder="请输入密码（至少6位）" required />
        </div>
        <div class="formrow">
          <label>确认</label>
          <input id="regPass2" type="password" maxlength="64" placeholder="再次输入密码" required />
        </div>
        <div class="formrow">
          <label>邮箱</label>
          <input id="regEmail" type="email" maxlength="64" placeholder="输入电子邮件" />
        </div>
        <div class="formrow">
          <label>验证码</label>
          <input id="capInput" type="text" maxlength="6" placeholder="计算结果" inputmode="numeric" style="max-width:120px;" required />
          <span class="captcha-q" id="capQ">?</span>
          <a class="btn" id="capRefresh" style="background:#2a2f3d;">换一题</a>
        </div>
        <input type="text" id="hp" class="hp" tabindex="-1" autocomplete="off" />
        <a class="btn" id="regBtn" style="border:none; margin-top:4px;">注册</a>
        <div id="regMsg"></div>
      </form>
    </div>

    <!-- 补丁下载 -->
    <div class="card">
      <h2>客户端补丁</h2>
      <a class="btn big" id="dlAll" href="#">点击下载</a>
      <div class="files" id="patchParts"></div>
    </div>

    <!-- 一键部署自己的服务器 -->
    <div class="card">
      <h2>一键部署自己的服务器</h2>
      <div class="file">
        <div class="meta">
          <div class="name" id="deployCmd">curl -fsSL .../acok.sh | bash</div>
        </div>
        <a class="btn" href="#" id="deployCopy">复制</a>
      </div>
    </div>
  </div>

  <script>
    function copyText(txt, el) {
      navigator.clipboard.writeText(txt);
      var old = el.textContent; el.textContent = '已复制';
      setTimeout(function(){ el.textContent = old; }, 1500);
    }

    // ===== 客户端验证码（不调用函数，纯本地计算；+ 蜜罐防机器）=====
    var capA, capB, capOp, capAns;
    function genCaptcha() {
      capA = 1 + Math.floor(Math.random() * 19);
      capB = 1 + Math.floor(Math.random() * 19);
      capOp = Math.random() < 0.5 ? '+' : '-';
      if (capOp === '-') {
        if (capB > capA) { var t = capA; capA = capB; capB = t; }
        capAns = capA - capB;
      } else {
        capAns = capA + capB;
      }
      document.getElementById('capQ').textContent = capA + ' ' + capOp + ' ' + capB + ' = ?';
    }
    genCaptcha();
    document.getElementById('capRefresh').addEventListener('click', function (e) {
      e.preventDefault(); genCaptcha();
      document.getElementById('capInput').value = '';
    });

    // 一键部署脚本地址（用本页所在的 CF Worker 域名）
    var deployCmd = 'curl -fsSL ' + location.origin + '/acok.sh | bash';
    document.getElementById('deployCmd').textContent = deployCmd;
    document.getElementById('deployCopy').addEventListener('click', function (e) {
      e.preventDefault(); copyText(deployCmd, this);
    });

    // ===== 补丁分卷列表 + 下载全部合并 =====
    var patchParts = [];
    fetch('./patches/patches-manifest.txt').then(function (r) { return r.text(); }).then(function (t) {
      patchParts = t.split('\n').filter(function (l) { return l.indexOf('file=') === 0; })
        .map(function (l) { return l.slice(5).split(' ')[0]; });
      var box = document.getElementById('patchParts');
      if (!box) return;
      if (!patchParts.length) { box.innerHTML = '<div style="color:var(--muted);font-size:13px;">暂无可下载的补丁分卷</div>'; return; }
      box.innerHTML = patchParts.map(function (p, i) {
        return '<div class="file"><div class="meta"><div class="name">分卷' + (i + 1) + '：' + p +
          '</div><div class="desc">单独下载这一卷</div></div>' +
          '<a class="btn" href="./patches/' + p + '" download>下载</a></div>';
      }).join('');
    }).catch(function () {});

    function downloadAll() {
      if (!patchParts.length) { alert('暂无可下载的补丁分卷'); return; }
      Promise.all(patchParts.map(function (p) {
        return fetch('./patches/' + p).then(function (r) { return r.arrayBuffer(); });
      })).then(function (bufs) {
        var blob = new Blob(bufs, { type: 'application/zip' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'patches-client.zip';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
      }).catch(function () { alert('合并下载失败，请改用分卷单独下载'); });
    }
    document.getElementById('dlAll').addEventListener('click', function (e) {
      e.preventDefault(); downloadAll();
    });

    // ===== 注册提交（含验证码 + 蜜罐校验）=====
    var REG_API = location.origin + '/api/register';
    document.getElementById('regBtn').addEventListener('click', function (e) {
      e.preventDefault();
      var msg = document.getElementById('regMsg');
      msg.className = ''; msg.textContent = '';
      if (document.getElementById('hp').value) { msg.className = 'err'; msg.textContent = '验证失败'; return; }
      var c = parseInt(document.getElementById('capInput').value, 10);
      if (isNaN(c) || c !== capAns) {
        msg.className = 'err'; msg.textContent = '验证码错误，已换一题';
        genCaptcha(); document.getElementById('capInput').value = ''; return;
      }
      var u = document.getElementById('regUser').value.trim();
      var p = document.getElementById('regPass').value;
      var p2 = document.getElementById('regPass2').value;
      var email = document.getElementById('regEmail').value.trim();
      if (!/^[A-Za-z0-9_]{3,32}$/.test(u)) { msg.className = 'err'; msg.textContent = '账号需 3-32 位英文/数字/下划线'; return; }
      if (p.length < 6 || /\s/.test(p)) { msg.className = 'err'; msg.textContent = '密码至少 6 位且不含空格'; return; }
      if (p !== p2) { msg.className = 'err'; msg.textContent = '两次密码不一致'; return; }
      if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg.className = 'err'; msg.textContent = '邮箱格式不正确'; return; }
      msg.textContent = '提交中…';
      fetch(REG_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p, email: email })
      }).then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, j: j }; });
      }).then(function (res) {
        if (res.ok) { msg.className = 'ok'; msg.textContent = '注册成功，可直接登录游戏'; }
        else { msg.className = 'err'; msg.textContent = (res.j && res.j.message) || '注册失败'; }
      }).catch(function () {
        msg.className = 'err';
        msg.textContent = '无法连接注册服务（Worker 可能未部署）。请用 GM 账号手动建号。';
      });
    });
  </script>
</body>
</html>
