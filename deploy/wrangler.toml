# AzerothCore-OK —— Cloudflare Worker 配置
# 部署：cd deploy && npx wrangler deploy
# 机密：wrangler secret put SOAP_PASSWORD

name = "azerothcore-ok"
main = "worker.js"
compatibility_date = "2025-04-01"

# 静态资源（注册页 index.html + 玩家补丁 patches/ + acok.sh）由 Workers Static Assets 托管
# 请求先过 worker.js；非 /api/* 的请求回退到这里托管的静态文件
# .assetsignore 已排除 worker.js / wrangler.toml，避免源码被当作静态资源泄露
assets = { directory = "./", not_found_handling = "none" }

# 后端 worldserver SOAP 配置（明文变量放这里；密码用 secret）
[vars]
WORLD_HOST = ""        # 部署机（worldserver）的公网域名或 IP
WORLD_PORT = "7878"   # SOAP 端口，固定
SOAP_LOGIN = "webreg" # SOAP 账号，与 worldserver 一致
