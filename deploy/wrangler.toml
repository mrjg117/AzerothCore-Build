# AzerothCore-OK —— Cloudflare Worker 配置
# 部署：Cloudflare 后台关联 GitHub 仓库，构建命令设为 `bash deploy/build.sh`，推送即自动构建并部署（Git 集成，无需 CLI）。
# 单点配置：[vars] 即全部非机密配置真相源。
#
# SOAP_LOGIN / SOAP_PASSWORD 说明：
#   - 两者均已注释掉：不在本文件定义。请直接在 Cloudflare 后台 Variables & Secrets 手动设置
#     SOAP_LOGIN（如 ACOK）与 SOAP_PASSWORD（强密码）。build.sh 部署只跑 `wrangler deploy`（不加 --var），
#     Worker 直接用你后台设的值；keep_vars = true 保证部署不冲掉它们。
#   - 游戏服 acok.sh 运行时仍需手动输入同一对值（SOAP_LOGIN 默认 ACOK、SOAP_PASSWORD 无默认值）。
#   - keep_vars = true：防御性保护你在 CF 后台手设的变量不被部署覆盖。

name = "acok"
main = "worker.js"
compatibility_date = "2025-04-01"

# 静态资源（注册页 index.html + 玩家补丁 patches/ + acok.sh + .env.example）由 Workers Static Assets 托管
# 请求先过 worker.js；非 /api/* 的请求回退到这里托管的静态文件
# .assetsignore 已排除 worker.js / wrangler.toml，避免源码被当作静态资源泄露
assets = { directory = "./", not_found_handling = "none" }

keep_vars = true

[vars]
WORLD_HOST = "yy.zhbq.eu.org"                                   # 游戏服公网域名/IP（玩家连 + Worker 连 SOAP 用）
WORLD_PORT = "7878"                                               # SOAP 端口
IMAGE_NS   = "ghcr.io/mrjg117"                                    # 镜像命名空间
# SOAP_LOGIN = "ACOK"                                               # 已注释：请在 CF 后台 Variables & Secrets 手动设置
# SOAP_PASSWORD = "ACOK"                                            # 已注释：请在 CF 后台 Variables & Secrets 手动设置
WORKER_BASE = "https://acok.zhbq.eu.org" # 本 Worker 地址（acok.sh 同源拉文件用）；自定义域名就填自定义域名
